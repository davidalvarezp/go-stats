name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build static release binaries
        run: |
          mkdir -p dist
          TAG_NAME=${GITHUB_REF#refs/tags/}
          
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/go-stats-linux-amd64 cmd/go-stats/main.go
          tar -czf dist/go-stats_${TAG_NAME}_linux_amd64.tar.gz -C dist go-stats-linux-amd64
          
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/go-stats-linux-arm64 cmd/go-stats/main.go
          tar -czf dist/go-stats_${TAG_NAME}_linux_arm64.tar.gz -C dist go-stats-linux-arm64

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
